name: Meter2

options:
  bundleIdPrefix: de.christiankaps
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: 2026.2.0
    CURRENT_PROJECT_VERSION: 1
    ENABLE_SECURITY_COMPILER_WARNINGS: YES

targets:
  Meter2:
    type: application
    platform: macOS
    deploymentTarget: "26.4"
    sources:
      - path: Meter2
      - path: Resources
        buildPhase: resources
        excludes:
          - AppIcon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.christiankaps.meter2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconVariants
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Meter2
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_CKSharingSupported: YES
        CODE_SIGN_ENTITLEMENTS: Meter2/Meter2.entitlements
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  Meter2Companion:
    type: application
    platform: iOS
    deploymentTarget: "26.4"
    sources:
      - path: Meter2/AppConfiguration.swift
      - path: Meter2/MeterDomain.swift
      - path: Meter2/Formatting.swift
      - path: Meter2/MeterLibrarySync.swift
      - path: Meter2Companion
      - path: Resources
        buildPhase: resources
        excludes:
          - AppIcon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.christiankaps.meter2.companion
        ASSETCATALOG_COMPILER_APPICON_NAME: CompanionAppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Meter2
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_CKSharingSupported: YES
        CODE_SIGN_ENTITLEMENTS: Meter2Companion/Meter2Companion.entitlements
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  Meter2Tests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.4"
    sources:
      - path: Meter2Tests
    dependencies:
      - target: Meter2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.christiankaps.meter2.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  Meter2CompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.4"
    sources:
      - path: Meter2CompanionUITests
    dependencies:
      - target: Meter2Companion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.christiankaps.meter2.companion.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

schemes:
  Meter2:
    build:
      targets:
        Meter2: all
    test:
      targets:
        - Meter2Tests
    run:
      config: Debug
    archive:
      config: Release

  Meter2Companion:
    build:
      targets:
        Meter2Companion: all
    test:
      targets:
        - Meter2CompanionUITests
    run:
      config: Debug
    archive:
      config: Release
