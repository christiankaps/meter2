name: Release macOS App

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the app build to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-attach:
    name: Build and attach Meter2.app
    runs-on: macos-latest
    env:
      APP_NAME: Meter2
      DERIVED_DATA_PATH: ${{ runner.temp }}/meter2-derived-data
      PROJECT: Meter2.xcodeproj
      SCHEME: Meter2

    steps:
      - name: Check out release ref
        if: github.event_name == 'release'
        uses: actions/checkout@v4

      - name: Check out dispatched release tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build release app
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Resolve release tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            release_tag="$(/usr/bin/ruby -rjson -e 'puts JSON.parse(File.read(ENV.fetch("GITHUB_EVENT_PATH"))).fetch("release").fetch("tag_name")')"
          else
            release_tag="$DISPATCH_TAG"
          fi

          test -n "$release_tag"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Package app
        id: package
        run: |
          set -euo pipefail
          app_path="$DERIVED_DATA_PATH/Build/Products/Release/$APP_NAME.app"
          release_tag="${{ steps.release.outputs.tag }}"
          safe_tag="${release_tag//\//-}"
          zip_path="$RUNNER_TEMP/$APP_NAME-$safe_tag.zip"

          test -d "$app_path"
          ditto -c -k --keepParent "$app_path" "$zip_path"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Attach app to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.release.outputs.tag }}" "${{ steps.package.outputs.zip_path }}" --clobber
